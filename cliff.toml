# git-cliff config for the repo's CHANGELOG.md.
# Regenerated on every release by .github/workflows/release.yml.
# See https://git-cliff.org/docs/configuration for field reference.

[changelog]
header = """
# Changelog

All notable changes to Blink, generated automatically from commit history on every release.
"""
body = """
## {{ release.version }}{% if release.timestamp %} - {{ release.timestamp | date(format="%Y-%m-%d") }}{% endif %}
{% for group, commits in release.commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | upper_first }}
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
protect_breaking_commits = true
topo_order_commits = true
sort_commits = "newest"
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
commit_parsers = [
  { message = '^chore\(release\)', skip = true },
  { message = '^Merge', skip = true },
  { message = '^feat', group = "Features" },
  { message = '^fix', group = "Bug Fixes" },
  { message = '^perf', group = "Performance" },
  { message = '^refactor', group = "Refactor" },
  { message = '^docs?', group = "Documentation" },
  { message = '^(ci|build|test|style|deploy|security)', group = "Maintenance" },
  { message = '^chore', group = "Chores" },
  { message = '.*', group = "Other" },
]
