name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        id: install
        run: npm install

      - name: Lint
        id: lint
        run: npm run lint

      - name: Test
        id: test
        run: npm test

      - name: Audit
        id: audit
        run: npm audit --audit-level=high

      - name: Job summary
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          {
            echo "### CI summary"
            echo ""
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Install dependencies | $INSTALL_OUTCOME |"
            echo "| Lint | $LINT_OUTCOME |"
            echo "| Test | $TEST_OUTCOME |"
            echo "| Audit | $AUDIT_OUTCOME |"
          } >> "$GITHUB_STEP_SUMMARY"
