name: Deploy Beszel

on:
  workflow_dispatch:

concurrency:
  group: deploy-beszel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || '22' }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # Same reset --hard as deploy.yml: /var/www/blink is a deploy target, not
      # somewhere anyone hand-edits, so this can never fail with "local changes
      # would be overwritten" the way `git pull` could.
      - name: Pull latest config and restart the Beszel stack
        id: deploy
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT || '22' }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /var/www/blink && git fetch origin main && git reset --hard origin/main && cd monitoring/beszel && docker compose pull && docker compose up -d"

      - name: Job summary
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "### Beszel deploy summary"
            echo ""
            echo "- Target: production VPS (monitoring stack)"
            echo "- Commit deployed: $SHA"
            echo "- SSH deploy step: $DEPLOY_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"
