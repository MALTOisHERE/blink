name: CodeQL Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: github/codeql-action/init@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        with:
          languages: javascript
          queries: security-and-quality

      - uses: github/codeql-action/autobuild@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3

      - uses: github/codeql-action/analyze@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        id: analyze

      - name: Job summary
        if: always()
        env:
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
        run: |
          {
            echo "### CodeQL scan summary"
            echo ""
            echo "- Language scanned: javascript"
            echo "- Query suite: security-and-quality"
            echo "- Analyze step: $ANALYZE_OUTCOME"
            echo "- Full results: see the repository's Security tab, Code scanning alerts"
          } >> "$GITHUB_STEP_SUMMARY"
