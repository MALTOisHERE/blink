services:
  blink:
    image: ghcr.io/maltoishere/blink:${BLINK_IMAGE_TAG:-latest}
    container_name: blink
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=${HOST}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES}
      - SECRET_KEY=${SECRET_KEY}
      - CIPHER_KEY=${CIPHER_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM:-Blink <noreply@yourdomain.com>}
      - LOGO_URL=${LOGO_URL}
      - STATS_FILE=/data/stats.json
      - LICENSES_FILE=/data/licenses.json
      - PADDLE_LICENSES_FILE=/data/paddle-licenses.json
      - SECRETS_SNAPSHOT_FILE=/data/secrets-snapshot.json
      - RATE_LIMITS_SNAPSHOT_FILE=/data/rate-limits-snapshot.json
      - LOGS_DIR=/data/logs
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PADDLE_API_KEY=${PADDLE_API_KEY}
      - PADDLE_ENV=${PADDLE_ENV:-production}
      - PADDLE_WEBHOOK_SECRET=${PADDLE_WEBHOOK_SECRET}
      - PADDLE_PRICE_ID=${PADDLE_PRICE_ID}
      - PADDLE_CLIENT_TOKEN=${PADDLE_CLIENT_TOKEN}
      - PRO_USAGE_RATE_LIMIT=${PRO_USAGE_RATE_LIMIT}
      - FREE_USAGE_RATE_LIMIT=${FREE_USAGE_RATE_LIMIT}
      - OWNER_EMAILS=${OWNER_EMAILS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI}
      - SESSION_SECRET=${SESSION_SECRET}
    volumes:
      - /var/www/blink/data:/data
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
