# git-cliff config for the HTML changelog partial served at /changelog
# (public/changelog-data.html). Regenerated on every release alongside
# CHANGELOG.md by .github/workflows/release.yml. Every interpolated field
# is escaped since commit text is not trusted HTML.
# See https://git-cliff.org/docs/configuration for field reference.

[changelog]
header = ""
body = """
{%- if commits %}
<article class="changelog-entry" id="{{ version | default(value="Unreleased") | escape }}">
  <div class="changelog-entry-head">
    <h2 class="changelog-version">{{ version | default(value="Unreleased") | escape }}</h2>
    {% if timestamp %}<time class="changelog-date" datetime="{{ timestamp | date(format="%Y-%m-%d") }}">{{ timestamp | date(format="%B %d, %Y") }}</time>{% endif %}
  </div>
  {% for group, group_commits in commits | group_by(attribute="group") %}
  <div class="changelog-group">
    <div class="changelog-group-label">{{ group | escape }}</div>
    <ul class="changelog-group-list">
      {% for commit in group_commits %}<li>{{ commit.message | upper_first | escape }}</li>
      {% endfor %}
    </ul>
  </div>
  {% endfor %}
</article>
{%- endif %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
protect_breaking_commits = true
topo_order_commits = true
sort_commits = "newest"
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
commit_parsers = [
  { message = '^chore\(release\)', skip = true },
  { message = '^Merge', skip = true },
  { message = '^feat', group = "Features" },
  { message = '^fix', group = "Bug Fixes" },
  { message = '^perf', group = "Performance" },
  { message = '^refactor', group = "Refactor" },
  { message = '^docs?', group = "Documentation" },
  { message = '^(ci|build|test|style|deploy|security)', group = "Maintenance" },
  { message = '^chore', group = "Chores" },
  { message = '.*', group = "Other" },
]
